<aside class="flex h-full w-16 min-w-16 flex-col items-center gap-1 border-r border-border bg-surface py-3">
  <a
    routerLink="/"
    title="Email Sandbox Home"
    class="flex h-10 w-10 items-center justify-center rounded-xl mb-1 text-primary transition-transform hover:scale-105"
  >
    <app-logo [size]="24" [showWordmark]="false" />
  </a>

  <div class="w-8 h-px bg-border/60 mb-2"></div>

  <a
    routerLink="/mailboxes"
    [class.bg-surface-raised]="isEmailSectionActive()"
    [class.text-primary]="isEmailSectionActive()"
    class="tooltip tooltip-right flex h-11 w-11 items-center justify-center rounded-field text-ink/60 transition-colors hover:bg-surface-raised hover:text-ink"
    data-tip="Email"
    aria-label="Email"
  >
    <ng-icon name="lucideInbox" size="20" />
  </a>
  <a
    routerLink="/organization"
    routerLinkActive="bg-surface-raised text-primary"
    class="tooltip tooltip-right flex h-11 w-11 items-center justify-center rounded-field text-ink/60 transition-colors hover:bg-surface-raised hover:text-ink"
    data-tip="Organization settings"
    aria-label="Organization settings"
  >
    <ng-icon name="lucideBuilding2" size="20" />
  </a>

  <div class="flex-1"></div>

  <app-theme-switcher class="mb-1" />
  <app-profile-menu />
</aside>

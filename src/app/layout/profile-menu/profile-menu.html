<div class="dropdown dropdown-top dropdown-start">
  <div
    tabindex="0"
    role="button"
    class="btn btn-ghost btn-circle"
    aria-label="Account menu"
    title="Account"
  >
    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-primary text-xs font-semibold text-primary-content">
      {{ initials() }}
    </div>
  </div>
  <ul tabindex="0" class="dropdown-content menu z-30 mb-2 w-60 rounded-box border border-border bg-surface-raised p-2 shadow-md">
    <li class="pointer-events-none px-3 py-2">
      <div class="flex flex-col items-start gap-0 !bg-transparent !p-0">
        <span class="font-medium text-ink">{{ authStore.user()?.name }}</span>
        <span class="truncate text-xs text-ink/60">{{ authStore.user()?.email }}</span>
      </div>
    </li>
    <div class="my-1 h-px bg-border" role="separator"></div>
    <li>
      <a routerLink="/profile" (click)="closeMenu()">
        <ng-icon name="lucideUser" size="16" />
        Profile
      </a>
    </li>
    <li>
      <a routerLink="/organization" (click)="closeMenu()">
        <ng-icon name="lucideSettings" size="16" />
        Settings
      </a>
    </li>
    <div class="my-1 h-px bg-border" role="separator"></div>
    <li>
      <button type="button" class="text-error" (click)="logout()">
        <ng-icon name="lucideLogOut" size="16" />
        Logout
      </button>
    </li>
  </ul>
</div>

@if (store.currentOrganization(); as current) {
  <div class="dropdown">
    <div tabindex="0" role="button" class="btn btn-ghost btn-sm gap-2 px-2">
      <ng-icon name="lucideBuilding2" size="16" class="text-ink/50" />
      <span class="max-w-40 truncate font-medium text-ink">{{ current.name }}</span>
      <ng-icon name="lucideChevronDown" size="14" class="text-ink/40" />
    </div>
    <ul tabindex="0" class="dropdown-content menu z-30 mt-2 w-64 rounded-box border border-border bg-surface-raised p-2 shadow-md">
      @for (org of store.organizations(); track org.id) {
        <li>
          <button type="button" class="flex items-center justify-between gap-2" (click)="select(org.id)">
            <span class="truncate">{{ org.name }}</span>
            @if (org.id === current.id) {
              <ng-icon name="lucideCheck" size="14" class="shrink-0 text-primary" />
            }
          </button>
        </li>
      }
    </ul>
  </div>
} @else {
  <div class="h-8 w-32 animate-pulse rounded-field bg-surface-raised"></div>
}

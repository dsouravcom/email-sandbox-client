<dialog #dialog class="modal" (close)="dismiss()">
  <div class="modal-box w-full max-w-3xl">
    <h3 class="text-lg font-semibold text-ink">Credentials</h3>
    <div class="mt-4">
      <app-credentials-view [mailbox]="mailbox()" [showHeading]="false" />
    </div>
    <div class="modal-action">
      <button type="button" class="btn btn-sm" (click)="close()">Done</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button aria-label="Close">close</button>
  </form>
</dialog>

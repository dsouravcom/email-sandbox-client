<h1 class="text-xl font-semibold text-ink">Sign in</h1>
<p class="mt-1 text-sm text-ink/60">Welcome back! Enter your details to continue.</p>

@if (notice(); as text) {
  <p class="alert alert-success mt-6" role="status">{{ text }}</p>
}

<form [formRoot]="loginForm" class="mt-6 space-y-5">
  <div>
    <label for="email" class="form-label">Email</label>
    <input
      id="email"
      type="email"
      autocomplete="email"
      class="form-input"
      [formField]="loginForm.email"
      [attr.aria-invalid]="loginForm.email().touched() && loginForm.email().invalid()"
    />
    <app-field-error [field]="loginForm.email" />
  </div>

  <div>
    <div class="flex items-baseline justify-between">
      <label for="password" class="form-label">Password</label>
      <a routerLink="/forgot-password" class="link link-primary text-sm">Forgot password?</a>
    </div>
    <input
      id="password"
      type="password"
      autocomplete="current-password"
      class="form-input"
      [formField]="loginForm.password"
      [attr.aria-invalid]="loginForm.password().touched() && loginForm.password().invalid()"
    />
    <app-field-error [field]="loginForm.password" />
  </div>

  @if (errorMessage(); as text) {
    <p class="alert alert-error" role="alert">{{ text }}</p>
  }

  <button type="submit" class="btn btn-primary w-full" [disabled]="loginForm().submitting()">
    {{ loginForm().submitting() ? 'Signing in…' : 'Sign in' }}
  </button>
</form>

<p class="mt-6 text-center text-sm text-ink/70">
  Don't have an account?
  <a routerLink="/register" class="link link-primary">Create one</a>
</p>

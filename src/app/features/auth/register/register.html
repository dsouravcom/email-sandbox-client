<h1 class="text-xl font-semibold text-ink">Create your account</h1>
<p class="mt-1 text-sm text-ink/60">We'll email you a code to verify your address.</p>

<form [formRoot]="registerForm" class="mt-6 space-y-5">
  <div>
    <label for="name" class="form-label">Name</label>
    <input
      id="name"
      type="text"
      autocomplete="name"
      class="form-input"
      [formField]="registerForm.name"
      [attr.aria-invalid]="registerForm.name().touched() && registerForm.name().invalid()"
    />
    <app-field-error [field]="registerForm.name" />
  </div>

  <div>
    <label for="email" class="form-label">Email</label>
    <input
      id="email"
      type="email"
      autocomplete="email"
      class="form-input"
      [formField]="registerForm.email"
      [attr.aria-invalid]="registerForm.email().touched() && registerForm.email().invalid()"
    />
    <app-field-error [field]="registerForm.email" />
  </div>

  <div>
    <label for="password" class="form-label">Password</label>
    <input
      id="password"
      type="password"
      autocomplete="new-password"
      class="form-input"
      [formField]="registerForm.password"
      [attr.aria-invalid]="registerForm.password().touched() && registerForm.password().invalid()"
    />
    <app-field-error [field]="registerForm.password" />
  </div>

  <div>
    <label for="confirmPassword" class="form-label">Confirm password</label>
    <input
      id="confirmPassword"
      type="password"
      autocomplete="new-password"
      class="form-input"
      [formField]="registerForm.confirmPassword"
      [attr.aria-invalid]="
        registerForm.confirmPassword().touched() && registerForm.confirmPassword().invalid()
      "
    />
    <app-field-error [field]="registerForm.confirmPassword" />
  </div>

  <div>
    <app-turnstile [siteKey]="turnstileSiteKey" (verified)="onTurnstileVerified($event)" (expired)="onTurnstileExpired()" />
    <app-field-error [field]="registerForm.turnstileToken" />
  </div>

  @if (errorMessage(); as text) {
    <p class="alert alert-error" role="alert">{{ text }}</p>
  }

  <button type="submit" class="btn btn-primary w-full" [disabled]="registerForm().submitting()">
    {{ registerForm().submitting() ? 'Creating account…' : 'Create account' }}
  </button>
</form>

<p class="mt-6 text-center text-sm text-ink/70">
  Already have an account?
  <a routerLink="/login" class="link link-primary">Sign in</a>
</p>

<h1 class="text-xl font-semibold text-ink">Forgot your password?</h1>
<p class="mt-1 text-sm text-ink/60">
  Enter your email and we'll send you a code to choose a new one.
</p>

<form [formRoot]="forgotForm" class="mt-6 space-y-5">
  <div>
    <label for="email" class="form-label">Email</label>
    <input
      id="email"
      type="email"
      autocomplete="email"
      class="form-input"
      [formField]="forgotForm.email"
      [attr.aria-invalid]="forgotForm.email().touched() && forgotForm.email().invalid()"
    />
    <app-field-error [field]="forgotForm.email" />
  </div>

  @if (errorMessage(); as text) {
    <p class="alert alert-error" role="alert">{{ text }}</p>
  }

  <button type="submit" class="btn btn-primary w-full" [disabled]="forgotForm().submitting()">
    {{ forgotForm().submitting() ? 'Sending code…' : 'Send reset code' }}
  </button>
</form>

<p class="mt-6 text-center text-sm">
  <a routerLink="/login" class="link link-primary">Back to sign in</a>
</p>

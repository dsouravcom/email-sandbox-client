<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Email Sandbox</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Applied before Angular bootstraps so switching themes never flashes the wrong one.
    try {
      var stored = localStorage.getItem('theme-preference');
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.setAttribute('data-theme', stored === 'light' ? 'sandboxlight' : 'sandboxdark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
